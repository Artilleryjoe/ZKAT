[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zkat"
version = "0.1.0"
description = "Zero-Knowledge Attestation Toolkit Milestone 1 scaffold"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ZKAT Team"}]
dependencies = [
    "lxml>=5.2",
    "gitpython>=3.1",
    "oqs>=0.10",
    "python-dateutil>=2.9",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.22",
]

[project.urls]
Homepage = "https://example.com/zkat"
